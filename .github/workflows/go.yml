name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.1'

      - name: Get version from Version.go
        id: get_version
        shell: pwsh
        run: |
          $version = Select-String -Path Version.go -Pattern 'NowVersion\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"' | ForEach-Object { $_.Matches.Groups[1].Value }
          if (-not $version) { throw "Failed to read NowVersion from Version.go" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Inject open-platform credentials
        shell: pwsh
        env:
          ACCESSKEY: ${{ secrets.ACCESSKEY }}
          ACCESSSECRET: ${{ secrets.ACCESSSECRET }}
          APPID: ${{ secrets.APPID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ACCESSKEY) -or [string]::IsNullOrWhiteSpace($env:ACCESSSECRET) -or [string]::IsNullOrWhiteSpace($env:APPID)) {
            throw "Missing ACCESSKEY, ACCESSSECRET, or APPID repository secrets"
          }
          (Get-Content RoomConnect.go) -replace 'AccessKey\s*=\s*".*"', "AccessKey = `"$env:ACCESSKEY`"" |
            Set-Content RoomConnect.go
          (Get-Content RoomConnect.go) -replace 'AccessSecret\s*=\s*".*"', "AccessSecret = `"$env:ACCESSSECRET`"" |
            Set-Content RoomConnect.go
          (Get-Content RoomConnect.go) -replace 'AppID\s*=\s*\d+', "AppID = $env:APPID" |
            Set-Content RoomConnect.go

      - name: Build Windows GUI executable
        run: go build -o "BiliLine_v${{ env.VERSION }}.exe" -ldflags "-w -s -H=windowsgui"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: BiliLine_v${{ env.VERSION }}.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.1'

      - name: Install Fyne / CGO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Get version from Version.go
        id: get_version
        run: |
          version="$(sed -n 's/.*NowVersion[[:space:]]*=[[:space:]]*"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/p' Version.go | head -n1)"
          if [ -z "$version" ]; then
            echo "Failed to read NowVersion from Version.go" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Inject open-platform credentials
        env:
          ACCESSKEY: ${{ secrets.ACCESSKEY }}
          ACCESSSECRET: ${{ secrets.ACCESSSECRET }}
          APPID: ${{ secrets.APPID }}
        run: |
          if [ -z "$ACCESSKEY" ] || [ -z "$ACCESSSECRET" ] || [ -z "$APPID" ]; then
            echo "Missing ACCESSKEY, ACCESSSECRET, or APPID repository secrets" >&2
            exit 1
          fi
          sed -i "s/AccessKey[[:space:]]*=[[:space:]]*\".*\"/AccessKey = \"$ACCESSKEY\"/" RoomConnect.go
          sed -i "s/AccessSecret[[:space:]]*=[[:space:]]*\".*\"/AccessSecret = \"$ACCESSSECRET\"/" RoomConnect.go
          sed -i "s/AppID[[:space:]]*=[[:space:]]*[0-9][0-9]*/AppID = $APPID/" RoomConnect.go

      - name: Build Linux amd64 binary
        env:
          CGO_ENABLED: "1"
        run: go build -o "BiliLine_v${VERSION}_linux_amd64" -ldflags "-w -s"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: BiliLine_v${{ env.VERSION }}_linux_amd64
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [build-windows, build-linux]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist

      - name: Resolve release tag
        run: |
          version="${{ needs.build-windows.outputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=v${version}" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          ls -la dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.VERSION }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
